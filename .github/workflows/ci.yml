name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK platform
        env:
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
        run: |
          set -eu
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT}"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"

          sudo apt-get update
          sudo apt-get install -y unzip wget

          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest" "$RUNNER_TEMP/android-cmdline-tools"

          # download command-line tools (update URL if Google changes it)
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -O "$RUNNER_TEMP/commandlinetools.zip"
          unzip -q "$RUNNER_TEMP/commandlinetools.zip" -d "$RUNNER_TEMP/android-cmdline-tools"
          mv "$RUNNER_TEMP/android-cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"

          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found at $SDKMANAGER"
            exit 1
          fi

          # refresh repository metadata
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --update || true

          # Accept licenses non-interactively (creates $ANDROID_SDK_ROOT/licenses)
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses

          # Install platform-tools, build-tools, and the platform
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" "platform-tools" "build-tools;37.0.0" "platforms;android-37"

      - name: Build project
        run: ./gradlew --no-daemon build

  format:
    name: Format
    runs-on: ubuntu-latest
